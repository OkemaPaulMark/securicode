# Gateway service pipeline. Included from the root .gitlab-ci.yml.
# Jobs are prefixed gw: and variables GW_ so they never clash with the other services.
#
# CI/CD variables (GitLab: Settings > CI/CD > Variables). Required:
#   JWT_SECRET        masked + protected   openssl rand -hex 32
#   GIT_TOKEN_KEY     masked + protected   openssl rand -hex 32   (AES-256 key for stored Git tokens, SEC-5)
#   INTERNAL_API_KEY  masked + protected   openssl rand -hex 24   (shared with the other services)
#   ADMIN_EMAIL       protected            first administrator account
#   ADMIN_PASSWORD    masked + protected   10+ characters
# Optional: PROJECT_SERVICE_URL, SCAN_SERVICE_URL, AI_SERVICE_URL, REPORTING_SERVICE_URL (e.g. http://10.10.1.3:8001),
#   PUBLIC_BASE_URL, SMTP_HOST/SMTP_PORT/SMTP_USER/SMTP_PASSWORD/SMTP_FROM, DAILY_ASSESSMENT_LIMIT, GATEWAY_ROUTES

variables:
  GW_DIR: services/gateway
  GW_IMAGE: securicode/gateway
  GW_CONTAINER: securicode-gateway
  GW_HOST: worker1
  GW_PORT: "8000"

.gw-base:
  tags: [docker]
  before_script:
    - chmod +x "$GW_DIR/ci/ci.sh"

.gw-on-change:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [services/gateway/**/*]
    - if: $CI_COMMIT_BRANCH
      changes: [services/gateway/**/*]

.gw-on-main:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "musheijaa"'
      changes: [services/gateway/**/*]

gw:test:
  extends: [.gw-base, .gw-on-change]
  stage: test
  script:
    - "$GW_DIR/ci/ci.sh test"          # ruff + pytest in docker build --target test; any failure stops here

gw:build:
  extends: [.gw-base, .gw-on-main]
  stage: build
  needs: ["gw:test"]
  script:
    - "$GW_DIR/ci/ci.sh build"         # image securicode/gateway:<commit short SHA> on worker1

gw:deploy:
  extends: [.gw-base, .gw-on-main]
  stage: deploy
  needs: ["gw:build"]
  resource_group: gateway
  environment:
    name: gateway
    url: http://$GW_HOST:$GW_PORT/docs
  script:
    - "$GW_DIR/ci/ci.sh deploy"        # waits for HEALTHCHECK, auto-rolls back if unhealthy
    - "$GW_DIR/ci/ci.sh status"

gw:rollback:
  extends: [.gw-base]
  stage: deploy
  needs: ["gw:deploy"]
  resource_group: gateway
  environment:
    name: gateway
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "musheijaa"'
      changes: [services/gateway/**/*]
      when: manual                     # a person decides when production goes backwards
  allow_failure: true
  script:
    - "$GW_DIR/ci/ci.sh rollback"      # optional variable ROLLBACK_TAG=<short sha>

gw:verify:
  extends: [.gw-base]
  stage: deploy
  needs: ["gw:deploy"]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "musheijaa"'
      changes: [services/gateway/**/*]
  allow_failure: true
  script:
    - bash "$GW_DIR/ci/verify.sh"
